target-version = "py312"
line-length = 120

[lint]
# E4/E7/E9 + F = real errors, undefined names, unused imports.
# Stated explicitly rather than inherited: ruff's implicit default rule set
# widened in 0.16 (adding I, UP, B, FURB, BLE, S, DTZ, ...), which turned CI
# red on ~900 pre-existing findings without a line of code changing. Adopting
# those families is a deliberate choice, not something a linter upgrade makes
# for us.
select = ["E4", "E7", "E9", "F"]
# E402 ignored: main.py and several routers intentionally import after
# runtime setup (logging config, circular-import guards).
ignore = ["E402"]

[lint.per-file-ignores]
# Alembic templates/migrations are generated code
"alembic/*" = ["F401"]
